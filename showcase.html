<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Indisponível</title>
  <style>
    body {
      background-color: #0A0E17;
      color: #94A3B8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .box {
      max-width: 480px;
      padding: 40px;
      background: #121826;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h1 {
      color: #FFFFFF;
      font-size: 22px;
      margin: 0 0 12px;
      font-weight: 700;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Acesso Temporariamente Desativado</h1>
    <p>O conteúdo desta página encontra-se restrito e indisponível no momento.</p>
  </div>
</body>
</html>
